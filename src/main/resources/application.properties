spring.application.name=eaecact3_t4

# Puerto y ruta base (context-path) del servidor Spring Boot
server.port=8083
server.servlet.context-path=/eaecact3

# Configuracion de conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/eaecact3?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=eaecact3
spring.datasource.password=eaecact3pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuracion de Thymeleaf
spring.thymeleaf.cache=false
