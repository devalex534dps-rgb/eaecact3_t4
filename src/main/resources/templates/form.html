        .gradient svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Contenedores principales */
        .mono-wrapper {
            position: relative;
            z-index: 1;
            padding: 3rem 1rem;
        }

        .mono-wrapper-sm {
            max-width: 680px;
        }

        .mono-wrapper-md {
            max-width: 720px;
        }

        .mono-panel {
            background: rgba(235, 246, 247, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 22px;
            box-shadow: 0 24px 64px rgba(28, 28, 28, 0.28);
            padding: 2.5rem;
        }

        .mono-panel-card {
            padding: 0;
            overflow: hidden;
        }

        /* Tipografía y cabeceras */
        .mono-eyebrow {
            font-family: 'Geist Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--charcoal);
            margin-bottom: 0.25rem;
        }

        .mono-eyebrow-light {
            color: var(--silver-grey);
            margin-bottom: 0.35rem;
        }

        .mono-title {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 2.7rem;
            font-weight: 400;
            color: var(--deep-umbrage);
            margin: 0;
            line-height: 1.1;
        }

        .mono-title-light {
            color: var(--indigo-white);
        }

        .mono-code {
            font-family: 'Geist Mono', monospace;
            font-size: 0.92rem;
            color: var(--deep-umbrage);
        }

        /* Tabla de listado */
        .mono-table-wrap {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(175, 175, 176, 0.55);
            background: rgba(235, 246, 247, 0.72);
        }

        .table-mono {
            margin-bottom: 0;
            color: var(--ink-black);
            --bs-table-bg: transparent;
            --bs-table-border-color: rgba(175, 175, 176, 0.45);
        }

        .table-mono thead th {
            background-color: var(--ink-black);
            color: var(--indigo-white);
            font-family: 'Geist Mono', monospace;
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 1rem 1.1rem;
            border-bottom: none;
        }

        .table-mono tbody td {
            padding: 0.95rem 1.1rem;
            vertical-align: middle;
            background-color: rgba(235, 246, 247, 0.55);
            transition: background-color 0.15s ease;
        }

        .table-mono tbody tr:nth-of-type(even) td {
            background-color: rgba(212, 219, 220, 0.38);
        }

        .table-mono tbody tr:hover td {
            background-color: rgba(175, 175, 176, 0.32);
        }

        /* Badges */
        .badge-categoria {
            display: inline-block;
            background-color: rgba(82, 78, 77, 0.14);
            color: var(--deep-umbrage);
            border: 1px solid rgba(82, 78, 77, 0.32);
            border-radius: 999px;
            padding: 0.3rem 0.85rem;
            font-size: 0.84rem;
            font-weight: 500;
        }

        /* Formularios */
        .mono-label {
            font-family: 'Geist Mono', monospace;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--charcoal);
            margin-bottom: 0.45rem;
        }

        .mono-input,
        .mono-select {
            background-color: rgba(235, 246, 247, 0.9);
            border: 1px solid var(--silver-grey);
            border-radius: 12px;
            color: var(--ink-black);
            padding: 0.7rem 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .mono-input:focus,
        .mono-select:focus {
            background-color: var(--indigo-white);
            border-color: var(--ink-black);
            color: var(--ink-black);
            box-shadow: 0 0 0 3px rgba(82, 78, 77, 0.18);
        }

        /* Vista de Detalle */
        .mono-header {
            background-color: var(--ink-black);
            color: var(--indigo-white);
            padding: 2rem 2.5rem;
        }

        .mono-body {
            padding: 2.25rem 2.5rem;
        }

        .mono-detail-row {
            padding: 0.9rem 0;
            border-bottom: 1px solid rgba(175, 175, 176, 0.45);
        }

        .mono-detail-row:last-child {
            border-bottom: none;
        }

        .mono-dt {
            font-family: 'Geist Mono', monospace;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--charcoal);
        }

        .mono-dd {
            font-size: 1.05rem;
            color: var(--ink-black);
            margin-bottom: 0;
        }

        .mono-footer {
            background-color: rgba(212, 219, 220, 0.45);
            border-top: 1px solid rgba(175, 175, 176, 0.45);
            padding: 1.4rem 2.5rem;
        }

        /* Botones en tonos Mono */
        .btn-mono-primary,
        .btn-mono-save {
            background-color: var(--ink-black);
            color: var(--indigo-white);
            border: 1px solid var(--ink-black);
            border-radius: 999px;
            padding: 0.55rem 1.45rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: all 0.2s ease;
        }

        .btn-mono-primary:hover,
        .btn-mono-save:hover {
            background-color: var(--charcoal);
            border-color: var(--charcoal);
            color: var(--indigo-white);
            transform: translateY(-1px);
        }

        .btn-mono-detail {
            background-color: var(--indigo-white);
            color: var(--ink-black);
            border: 1px solid var(--silver-grey);
            border-radius: 999px;
            padding: 0.35rem 0.9rem;
            font-size: 0.84rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-mono-detail:hover {
            background-color: var(--silver-light);
            border-color: var(--charcoal);
            color: var(--ink-black);
        }

        .btn-mono-edit {
            background-color: var(--charcoal);
            color: var(--indigo-white);
            border: 1px solid var(--charcoal);
            border-radius: 999px;
            padding: 0.35rem 0.95rem;
            font-size: 0.84rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-mono-edit:hover {
            background-color: var(--deep-umbrage);
            border-color: var(--deep-umbrage);
            color: var(--indigo-white);
        }

        .btn-mono-delete {
            background-color: transparent;
            color: var(--deep-umbrage);
            border: 1px solid var(--charcoal);
            border-radius: 999px;
            padding: 0.35rem 0.95rem;
            font-size: 0.84rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-mono-delete:hover {
            background-color: var(--ink-black);
            border-color: var(--ink-black);
            color: var(--indigo-white);
        }

        .btn-mono-cancel,
        .btn-mono-back {
            background-color: var(--silver-light);
            color: var(--ink-black);
            border: 1px solid var(--silver-grey);
            border-radius: 999px;
            padding: 0.55rem 1.45rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-mono-cancel:hover,
        .btn-mono-back:hover {
            background-color: var(--silver-grey);
            border-color: var(--charcoal);
            color: var(--ink-black);
        }

        .mono-footer .btn-mono-edit,
        .mono-footer .btn-mono-delete {
            padding: 0.55rem 1.35rem;
            font-size: 0.95rem;
        }

        /* SweetAlert2 Mono Organic Customization */
        .swal2-popup.swal-mono-popup {
            background: var(--indigo-white) !important;
            color: var(--ink-black) !important;
            border: 1px solid var(--silver-grey) !important;
            border-radius: 20px !important;
            box-shadow: 0 24px 60px rgba(28, 28, 28, 0.45) !important;
            font-family: 'Instrument Sans', sans-serif !important;
        }

        .swal-mono-title {
            font-family: 'Instrument Serif', Georgia, serif !important;
            font-size: 2rem !important;
            font-weight: 400 !important;
            color: var(--deep-umbrage) !important;
        }

        .swal-mono-html {
            color: var(--charcoal) !important;
            font-size: 0.98rem !important;
        }

        .swal-mono-confirm {
            background-color: var(--ink-black) !important;
            color: var(--indigo-white) !important;
            border: 1px solid var(--ink-black) !important;
            border-radius: 999px !important;
            padding: 0.55rem 1.4rem !important;
            font-weight: 500 !important;
            box-shadow: none !important;
        }

        .swal-mono-confirm:hover {
            background-color: var(--charcoal) !important;
            border-color: var(--charcoal) !important;
        }

        .swal-mono-cancel {
            background-color: var(--silver-light) !important;
            color: var(--ink-black) !important;
            border: 1px solid var(--silver-grey) !important;
            border-radius: 999px !important;
            padding: 0.55rem 1.4rem !important;
            font-weight: 500 !important;
            box-shadow: none !important;
        }

        .swal-mono-cancel:hover {
            background-color: var(--silver-grey) !important;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="gradient" role="img" aria-label="Mono bands">

    </div>

    <main class="container mono-wrapper mono-wrapper-sm">
        <section class="mono-panel">
            <div class="mono-eyebrow">Registro · Producto ↔ Categoría</div>
            <h2 class="mono-title mb-4" th:text="${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'}">
                Formulario de Producto</h2>

            <form id="productoForm"
                th:action="${producto.id == null} ? @{/productos/guardar} : @{/productos/actualizar/{id}(id=${producto.id})}"
                th:object="${producto}" method="post" novalidate>

                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label mono-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control mono-input"
                        placeholder="Ej. Teclado Mecánico" required />
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label mono-label">Precio</label>
                        <input type="number" step="0.01" min="0" th:field="*{precio}" class="form-control mono-input"
                            placeholder="0.00" required />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label mono-label">Stock</label>
                        <input type="number" min="0" th:field="*{stock}" class="form-control mono-input" placeholder="0"
                            required />
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label mono-label">Categoría</label>
                    <select th:field="*{categoriaId}" class="form-select mono-select" required>
                        <option value="">-- Seleccione una categoría --</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                </div>

                <div class="d-flex gap-2 pt-2">
                    <button type="submit" class="btn btn-mono-save">Guardar</button>
                    <a th:href="@{/productos}" class="btn btn-mono-cancel">Cancelar</a>
                </div>

            </form>
        </section>
    </main>

    <script>
        document.getElementById('productoForm').addEventListener('submit', function (event) {
            if (!this.checkValidity()) {
                event.preventDefault();
                Swal.fire({
                    title: 'Campos incompletos',
                    html: 'Por favor completa todos los campos requeridos y selecciona una <strong>categoría</strong> válida.',
                    icon: 'warning',
                    iconColor: '#524E4D',
                    confirmButtonText: 'Entendido',
                    backdrop: 'rgba(28, 28, 28, 0.58)',
                    customClass: {
                        popup: 'swal-mono-popup',
                        title: 'swal-mono-title',
                        htmlContainer: 'swal-mono-html',
                        confirmButton: 'swal-mono-confirm'
                    }
                });
            }
        });
    </script>

</body>

</html>
