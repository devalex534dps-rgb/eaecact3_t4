<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${producto.id == null ? 'Nuevo Producto · Mono Bands' : 'Editar Producto · Mono Bands'}">Formulario de Producto</title>
    <!--
      Mono bands · INDIGO WHITE #EBF6F7 · SILVER GREY #AFAFB0 · CHARCOAL #524E4D · INK BLACK #1C1C1C
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&family=Geist+Mono:wght@400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="gradient" role="img" aria-label="Mono bands">

</div>

<main class="container mono-wrapper mono-wrapper-sm">
    <section class="mono-panel">
        <div class="mono-eyebrow">Registro · Producto ↔ Categoría</div>
        <h2 class="mono-title mb-4" th:text="${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'}">Formulario de Producto</h2>

        <form id="productoForm"
              th:action="${producto.id == null} ? @{/guardar} : @{/actualizar/{id}(id=${producto.id})}"
              th:object="${producto}"
              method="post"
              novalidate>

            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label mono-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control mono-input" placeholder="Ej. Teclado Mecánico" required/>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label mono-label">Precio</label>
                    <input type="number" step="0.01" min="0" th:field="*{precio}" class="form-control mono-input" placeholder="0.00" required/>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label mono-label">Stock</label>
                    <input type="number" min="0" th:field="*{stock}" class="form-control mono-input" placeholder="0" required/>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label mono-label">Categoría</label>
                <select th:field="*{categoriaId}" class="form-select mono-select" required>
                    <option value="">-- Seleccione una categoría --</option>
                    <option th:each="c : ${categorias}"
                            th:value="${c.id}"
                            th:text="${c.nombre}"></option>
                </select>
            </div>

            <div class="d-flex gap-2 pt-2">
                <button type="submit" class="btn btn-mono-save">Guardar</button>
                <a th:href="@{/productos}" class="btn btn-mono-cancel">Cancelar</a>
            </div>

        </form>
    </section>
</main>

<script>
    document.getElementById('productoForm').addEventListener('submit', function (event) {
        if (!this.checkValidity()) {
            event.preventDefault();
            Swal.fire({
                title: 'Campos incompletos',
                html: 'Por favor completa todos los campos requeridos y selecciona una <strong>categoría</strong> válida.',
                icon: 'warning',
                iconColor: '#524E4D',
                confirmButtonText: 'Entendido',
                backdrop: 'rgba(28, 28, 28, 0.58)',
                customClass: {
                    popup: 'swal-mono-popup',
                    title: 'swal-mono-title',
                    htmlContainer: 'swal-mono-html',
                    confirmButton: 'swal-mono-confirm'
                }
            });
        }
    });
</script>

</body>
</html>
